name: nms-dashboard

services:
  postgres:
    image: postgres:16-alpine
    container_name: nms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-nms_dashboard}"
      POSTGRES_USER: "${POSTGRES_USER:-nms}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - nms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nms-net

  nms-bff:
    image: ${DOCKERHUB_NAMESPACE}/nms-dashboard-bff:${IMAGE_TAG}
    container_name: nms-bff
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      PORT: "8080"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-30}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
      PUBLIC_DEMO_MODE: "${PUBLIC_DEMO_MODE:-true}"
      NMS_DATA_SOURCE: "${NMS_DATA_SOURCE:-postgres}"
      DATABASE_URL: "${DATABASE_URL:-postgres://nms:${POSTGRES_PASSWORD}@postgres:5432/nms_dashboard?sslmode=disable}"
      NMS_INGEST_API_KEY: "${NMS_INGEST_API_KEY}"

    ports:
      - "8080:8080"

    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/health
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - nms-net

    depends_on:
      postgres:
        condition: service_healthy

  nms-web:
    image: ${DOCKERHUB_NAMESPACE}/nms-dashboard-web:${IMAGE_TAG}
    container_name: nms-web
    restart: unless-stopped

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ""

    ports:
      - "3001:3000"

    depends_on:
      nms-bff:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:3000/
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - nms-net

networks:
  nms-net:
    external: true
    name: ${NMS_DOCKER_NETWORK}

volumes:
  nms-postgres-data:
