name: nms-dashboard

services:
  nms-bff:
    image: ${DOCKERHUB_NAMESPACE}/nms-dashboard-bff:${IMAGE_TAG}
    container_name: nms-bff
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      PORT: "8080"
      THINGSBOARD_BASE_URL: "${THINGSBOARD_BASE_URL:-http://host.docker.internal:8081}"
      THINGSBOARD_API_KEY: "${THINGSBOARD_API_KEY}"
      THINGSBOARD_SITE_ASSET_TYPE: "${THINGSBOARD_SITE_ASSET_TYPE:-site}"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-30}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
      PUBLIC_DEMO_MODE: "${PUBLIC_DEMO_MODE:-true}"

    ports:
      - "127.0.0.1:8080:8080"

    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/health
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - nms-net

  nms-web:
    image: ${DOCKERHUB_NAMESPACE}/nms-dashboard-web:${IMAGE_TAG}
    container_name: nms-web
    restart: unless-stopped

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ""

    ports:
      - "127.0.0.1:3001:3000"

    depends_on:
      nms-bff:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:3000/
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - nms-net

networks:
  nms-net:
    external: true
    name: ${NMS_DOCKER_NETWORK}
