services:
  postgres:
    image: postgres:16-alpine
    container_name: nms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-nms_dashboard}"
      POSTGRES_USER: "${POSTGRES_USER:-nms}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nms}"
    volumes:
      - nms-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nms-bff:
    build:
      context: ../apps/bff
      dockerfile: Dockerfile
    container_name: nms-bff
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      PORT: "${PORT:-8080}"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-30}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
      PUBLIC_DEMO_MODE: "${PUBLIC_DEMO_MODE:-true}"
      NMS_DATA_SOURCE: "${NMS_DATA_SOURCE:-postgres}"
      DATABASE_URL: "${DATABASE_URL:-postgres://nms:nms@postgres:5432/nms_dashboard?sslmode=disable}"
      NMS_INGEST_API_KEY: "${NMS_INGEST_API_KEY:-dev-ingest-key}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  nms-web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: nms-web
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      nms-bff:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  nms-postgres-data:
